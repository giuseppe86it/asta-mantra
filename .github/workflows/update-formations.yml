name: Update probable formations

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: update-probable-formations
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Refresh Fantacalcio probable formations
        run: python scripts/update_formations.py

      - name: Commit feed when changed
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- formations-current.json)" ]]; then
            echo "No formation changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add formations-current.json
          git commit -m "chore: update probable formations"
          git push
