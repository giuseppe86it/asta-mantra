<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#0b1220">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Asta Mantra">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css?v=1.21">
  <title>Asta Mantra</title>
</head>
<body>
  <div id="lock" class="lock hidden">
    <div class="lock-card">
      <h1>🔒 Asta Mantra</h1>
      <p id="lockText">Inserisci il PIN.</p>
      <input id="pinInput" type="password" inputmode="numeric" maxlength="8" placeholder="PIN">
      <button id="unlockBtn" class="primary">Sblocca</button>
      <button id="disablePinBtn" class="ghost">Disattiva PIN</button>
    </div>
  </div>

  <header class="topbar">
    <div>
      <div class="eyebrow">Fantacalcio Mantra 26/27</div>
      <h1>Asta Mantra</h1>
    </div>
    <button id="settingsBtn" class="icon-btn" aria-label="Impostazioni">⚙️</button>
  </header>

  <main id="app">
    <section id="dashboardView" class="view active"></section>
    <section id="playersView" class="view"></section>
    <section id="squadView" class="view"></section>
    <section id="planView" class="view"></section>
    <section id="leagueView" class="view"></section>
    <section id="settingsView" class="view"></section>
  </main>

  <nav class="tabbar">
    <button data-view="dashboardView" class="tab active"><span>📊</span><small>Dashboard</small></button>
    <button data-view="playersView" class="tab"><span>🔎</span><small>Giocatori</small></button>
    <button data-view="squadView" class="tab"><span>👥</span><small>Rosa</small></button>
    <button data-view="planView" class="tab"><span>🎯</span><small>Piano</small></button>
    <button data-view="leagueView" class="tab"><span>🏆</span><small>Leghe</small></button>
  </nav>

  <dialog id="playerDialog">
    <div id="playerDialogContent"></div>
  </dialog>


  <dialog id="formationDialog">
    <div id="formationDialogContent"></div>
  </dialog>


  <dialog id="leagueDialog">
    <form id="leagueForm">
      <h2>Crea lega</h2>
      <label>Nome lega
        <input id="leagueNameInput" type="text" maxlength="40" placeholder="Es. Fanta Amici 26/27" required>
      </label>
      <label>Numero partecipanti
        <select id="leagueSizeInput" required>
          <option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8" selected>8</option><option value="9">9</option><option value="10">10</option><option value="11">11</option><option value="12">12</option><option value="13">13</option><option value="14">14</option><option value="15">15</option><option value="16">16</option><option value="17">17</option><option value="18">18</option><option value="19">19</option><option value="20">20</option>
        </select>
      </label>
      <p class="muted dialog-note">La prima squadra sarà la tua rosa. Potrai rinominare tutte le squadre dopo la creazione.</p>
      <div class="dialog-actions">
        <button type="button" id="cancelLeagueCreate" class="ghost">Annulla</button>
        <button type="submit" class="primary">Crea lega</button>
      </div>
    </form>
  </dialog>

  <dialog id="soldDialog">
    <form id="soldForm">
      <h2 id="soldTitle">Giocatore venduto</h2>
      <label>Squadra
        <select id="soldTeamSelect"></select>
      </label>
      <label>Prezzo pagato
        <input id="soldPriceInput" type="number" min="1" step="1" inputmode="numeric" required>
      </label>
      <p id="soldLeagueNote" class="muted dialog-note"></p>
      <div class="dialog-actions">
        <button type="button" id="cancelSold" class="ghost">Annulla</button>
        <button type="submit" class="soldbtn">Conferma venduto</button>
      </div>
    </form>
  </dialog>

  <dialog id="purchaseDialog">
    <form method="dialog" id="purchaseForm">
      <h2 id="purchaseTitle">Acquista</h2>
      <label>Prezzo pagato
        <input id="purchasePrice" type="number" min="1" step="1" inputmode="numeric" required>
      </label>
      <div id="purchaseSignal" class="signal"></div>
      <div class="dialog-actions">
        <button type="button" id="cancelPurchase" class="ghost"
          onclick="if(document.activeElement)document.activeElement.blur();const d=this.closest('dialog');if(d&&d.open)d.close();document.getElementById('purchasePrice').value='';document.getElementById('purchaseSignal').textContent='';return false;">Annulla</button>
        <button id="confirmPurchase" value="default" class="primary">Conferma</button>
      </div>
    </form>
  </dialog>

  <script src="players.js?v=1.21"></script>
  <script src="formations.js?v=1.21"></script>
  <script src="market.js?v=1.21"></script>
  <script src="app.js?v=1.22"></script>
</body>
</html>
